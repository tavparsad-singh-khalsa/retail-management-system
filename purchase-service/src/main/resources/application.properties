spring.application.name=purchase-service
server.port=9093

jwt.secret=${JWT_SECRET}

product-service.url=http://localhost:9092

product-service.connect-timeout=5s
product-service.read-timeout=5s

spring.datasource.url=jdbc:postgresql://localhost:5432/retail_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_purchase

spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
spring.application.name=purchase-service
server.port=9093

product-service.url=http://localhost:9092

product-service.connect-timeout=5s
product-service.read-timeout=5s

spring.datasource.url=jdbc:postgresql://localhost:5432/retail_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.error.include-message=always

server.error.include-binding-errors=always
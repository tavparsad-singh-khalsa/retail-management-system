spring.application.name=sales-service

server.port=9094

jwt.secret=${JWT_SECRET}

product-service.url=http://localhost:9092
product-service.connect-timeout=5s
product-service.read-timeout=30s

billing-service.url=http://localhost:9096
billing-service.connect-timeout=5s
billing-service.read-timeout=10s

spring.datasource.url=jdbc:postgresql://localhost:55432/sales_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=never
server.error.include-binding-errors=never
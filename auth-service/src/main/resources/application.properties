spring.application.name=auth-service
server.port=9091

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

owner.default.username=${OWNER_DEFAULT_USERNAME:-owner}
owner.default.email=${OWNER_DEFAULT_EMAIL:-}
owner.default.phone=${OWNER_DEFAULT_PHONE:-}
owner.default.full-name=${OWNER_DEFAULT_FULL_NAME:-Default Owner}
owner.default.password=${OWNER_DEFAULT_PASSWORD:?OWNER_DEFAULT_PASSWORD must be set in .env}

dev.admin.username=${DEV_ADMIN_USERNAME:-admin}
dev.admin.email=${DEV_ADMIN_EMAIL:-admin@retail.local}
dev.admin.phone=${DEV_ADMIN_PHONE:-9999999999}
dev.admin.full-name=${DEV_ADMIN_FULL_NAME:-Development Admin}
dev.admin.password=${DEV_ADMIN_PASSWORD:?DEV_ADMIN_PASSWORD must be set in .env}

spring.datasource.url=jdbc:postgresql://localhost:5432/retail_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_auth

spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-binding-errors=never
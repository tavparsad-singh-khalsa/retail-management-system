spring.application.name=auth-service
server.port=9091

jwt.secret=test-secret-for-auth-service-only-0123456789
jwt.expiration=86400000

owner.default.username=owner
owner.default.email=owner@retail.local
owner.default.phone=9999999998
owner.default.full-name=Default Owner
owner.default.password=TestOwnerPassword123!

dev.admin.username=admin
dev.admin.email=admin@retail.local
dev.admin.phone=9999999999
dev.admin.full-name=Development Admin
dev.admin.password=TestDevAdminPassword123!

spring.datasource.url=jdbc:h2:mem:auth-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
